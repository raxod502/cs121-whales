[tool.poetry]
name = "cs121-whales"
version = "1.0.0"
description = "Chess AI web application using minimax and deep learning on backend"
authors = ["Ben Baral", "Shannon Collier", "Miles President", "Radon Rosborough", "Max Treutelaar"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.8, <3.11"
black = "^24.3.0"
Flask = "^2.3.2"
flask-talisman = "^1.0.0"
gunicorn = "^23.0.0"
chess = "^1.9.2"
onnxruntime = "^1.12.1"
onnx = "^1.17.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
